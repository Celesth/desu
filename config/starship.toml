# DESU minimal Nvim-style prompt.
add_newline = true
command_timeout = 500
palette = "desu"
format = "$username$hostname$directory$git_branch$git_status$line_break$character"

[palettes.desu]
text = "#E6E6E6"
muted = "#858585"
secondary = "#B8B8B8"
accent = "#D0D0D0"
error = "#FFB4AB"

[username]
show_always = true
style_user = "bold fg:text"
format = "[$user]($style)"

[directory]
style = "bold fg:text"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"

[hostname]
ssh_only = false
trim_at = "."
style = "fg:muted"
format = "[@$hostname]($style) "

[git_branch]
symbol = " "
style = "fg:secondary"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:muted"
format = "([$all_status$ahead_behind]($style))"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = '$${count}'
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](bold fg:accent) "
error_symbol = "[❯](bold fg:error) "
