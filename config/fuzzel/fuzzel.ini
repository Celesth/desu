# DESU launcher / clipboard picker theme.
# Monochrome, square corners, no shadows, no animations.

[main]
font=Iosevka Nerd Font:size=10
prompt="> "
# Icons in an application list are multicolour; DESU stays monochrome.
icons-enabled=no
lines=12
width=44
horizontal-pad=14
vertical-pad=12
inner-pad=8
anchor=center

[border]
width=1
radius=0

[colors]
background=202020ff
text=e6e6e6ff
prompt=858585ff
input=e6e6e6ff
match=e6e6e6ff
selection=3a3a3aff
selection-text=e6e6e6ff
selection-match=e6e6e6ff
border=555555ff

[dmenu]
exit-immediately-if-empty=yes
