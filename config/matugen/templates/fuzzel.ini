# DESU launcher / clipboard picker theme, generated from the wallpaper palette.

[main]
font=JetBrainsMonoNL Nerd Font Mono:size=10
prompt="> "
icons-enabled=no
lines=12
width=44
horizontal-pad=14
vertical-pad=12
inner-pad=8
anchor=center

[border]
width=1
radius=0

[colors]
background={{colors.background.dark.hex_stripped}}e6
text={{colors.on_background.dark.hex_stripped}}ff
prompt={{colors.outline_variant.dark.hex_stripped}}ff
input={{colors.on_background.dark.hex_stripped}}ff
match={{colors.primary.dark.hex_stripped}}ff
selection={{colors.primary_container.dark.hex_stripped}}f0
selection-text={{colors.on_primary_container.dark.hex_stripped}}ff
selection-match={{colors.on_primary_container.dark.hex_stripped}}ff
border={{colors.outline.dark.hex_stripped}}dd

[dmenu]
exit-immediately-if-empty=yes
